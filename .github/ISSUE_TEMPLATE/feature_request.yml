name: Feature request
description: Propose a focused improvement to the deterministic kernel.
title: "[feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What job cannot be expressed reliably with the current kernel?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed contract
      description: Describe inputs, outputs, deterministic gates, failure behavior, and evidence.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Core boundary
      options:
        - label: This belongs in Core rather than Studio, batch, evaluation, scheduling, or the software-factory layer.
          required: true
