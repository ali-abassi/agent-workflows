name: Bug report
description: Report reproducible incorrect behavior in Agent Workflows.
title: "[bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, API keys, private prompts, or sensitive run artifacts.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the command, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide a minimal sanitized steps.yaml and input when possible.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and Pi version if relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Relevant validation output, trace events, or errors with secrets removed.
