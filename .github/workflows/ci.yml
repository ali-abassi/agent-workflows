name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.txt
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/python -m py_compile scripts/*.py
      - run: ./bin/piw validate examples/hello.steps.yaml --strict
      - run: ./bin/piw run examples/hello.steps.yaml --input Ada --strict --json
      - run: .venv/bin/python -m pip wheel . --no-deps -w dist
      - run: .venv/bin/python scripts/check_wheel.py dist/*.whl
      - run: python -m venv .install-test
      - run: .install-test/bin/python -m pip install dist/*.whl
      - run: .install-test/bin/piw validate examples/hello.steps.yaml --strict
