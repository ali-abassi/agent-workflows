<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 430" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="1" y="1" width="1238" height="428" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- 1. steps.yaml -->
  <rect x="36" y="90" width="180" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="126" y="118" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">steps.yaml</text>
  <text x="126" y="136" text-anchor="middle" fill="#8b949e" font-size="12">your checklist</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7ee787">
    <text x="54" y="160">- id: build</text>
    <text x="54" y="178">- id: test</text>
    <text x="54" y="196">- id: ship</text>
  </g>

  <!-- arrow 1 -->
  <line x1="216" y1="150" x2="272" y2="150" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="244" y="138" text-anchor="middle" fill="#8b949e" font-size="11" font-family="ui-monospace, Menlo, monospace">piw run</text>

  <!-- 2. runner -->
  <rect x="280" y="90" width="200" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="380" y="118" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">deterministic runner</text>
  <text x="380" y="136" text-anchor="middle" fill="#8b949e" font-size="12">code owns the order</text>
  <text x="380" y="164" text-anchor="middle" fill="#8b949e" font-size="12">dependencies &#183; routing</text>
  <text x="380" y="182" text-anchor="middle" fill="#8b949e" font-size="12">retries &#183; timeouts</text>

  <!-- arrow 2 -->
  <line x1="480" y1="150" x2="536" y2="150" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 3. step executes -->
  <rect x="544" y="90" width="190" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="639" y="118" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">step executes</text>
  <text x="639" y="136" text-anchor="middle" fill="#8b949e" font-size="12">shell command, or</text>
  <text x="639" y="164" text-anchor="middle" fill="#8b949e" font-size="12">an agent does the work:</text>
  <text x="639" y="184" text-anchor="middle" fill="#58a6ff" font-size="12" font-family="ui-monospace, Menlo, monospace">claude &#183; codex &#183; pi</text>

  <!-- arrow 3 -->
  <line x1="734" y1="150" x2="790" y2="150" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 4. gate -->
  <rect x="798" y="90" width="150" height="120" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="873" y="120" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="700">GATE</text>
  <text x="873" y="140" text-anchor="middle" fill="#8b949e" font-size="12">a real test checks</text>
  <text x="873" y="158" text-anchor="middle" fill="#8b949e" font-size="12">the output &#8212; the</text>
  <text x="873" y="176" text-anchor="middle" fill="#8b949e" font-size="12">agent can&#8217;t talk</text>
  <text x="873" y="194" text-anchor="middle" fill="#8b949e" font-size="12">its way past it</text>

  <!-- pass arrow -->
  <line x1="948" y1="150" x2="1004" y2="150" stroke="#3fb950" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="976" y="138" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="600">pass</text>

  <!-- 5. proof -->
  <rect x="1012" y="90" width="192" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="1108" y="116" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">runs/&#60;id&#62;/ &#8212; proof</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="1030" y="140" fill="#3fb950">&#10003;</text><text x="1046" y="140" fill="#8b949e">every step output</text>
    <text x="1030" y="158" fill="#3fb950">&#10003;</text><text x="1046" y="158" fill="#8b949e">full timeline</text>
    <text x="1030" y="176" fill="#3fb950">&#10003;</text><text x="1046" y="176" fill="#8b949e">cost per step</text>
    <text x="1030" y="194" fill="#3fb950">&#10003;</text><text x="1046" y="194" fill="#8b949e">frozen input</text>
  </g>

  <!-- fail path -->
  <path d="M 848 210 L 848 268" stroke="#f85149" stroke-width="2" fill="none" marker-end="url(#arrRed)"/>
  <text x="862" y="244" fill="#f85149" font-size="11" font-weight="600">fail</text>

  <rect x="560" y="276" width="560" height="40" rx="20" fill="#161b22" stroke="#f8514966"/>
  <text x="840" y="301" text-anchor="middle" fill="#e6edf3" font-size="13">bounded retry &#8635; &#8212; then the run <tspan fill="#f85149" font-weight="600">stops loudly</tspan> instead of pretending</text>
  <path d="M 560 296 C 500 296 470 250 500 210 C 520 190 560 200 600 205" stroke="#f85149" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrRed)" opacity="0.7"/>

  <rect x="560" y="330" width="560" height="40" rx="20" fill="#161b22" stroke="#58a6ff66"/>
  <text x="840" y="355" text-anchor="middle" fill="#e6edf3" font-size="13">fix the cause &#8594; <tspan fill="#58a6ff" font-family="ui-monospace, Menlo, monospace">piw resume</tspan> continues from the exact same step</text>

  <!-- caption -->
  <text x="620" y="406" text-anchor="middle" fill="#8b949e" font-size="13">No server. No database. A run is a folder you can <tspan font-family="ui-monospace, Menlo, monospace">ls</tspan>, <tspan font-family="ui-monospace, Menlo, monospace">diff</tspan>, and commit.</text>

  <!-- top label -->
  <text x="620" y="52" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="600">One YAML file in &#8594; every step tested &#8594; provable results out</text>
</svg>
