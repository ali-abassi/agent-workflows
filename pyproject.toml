[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-graph-core"
version = "0.1.0"
description = "Deterministic workflow creation, execution, recovery, and evidence for agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6,<7",
  "ruamel.yaml>=0.18,<0.19",
  "jsonschema>=4.23,<5",
]

[tool.setuptools]
py-modules = []
