[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-graph-core"
dynamic = ["version"]
description = "Deterministic workflow creation, execution, recovery, and evidence for agents"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ali Abassi" }]
requires-python = ">=3.10"
keywords = ["agents", "workflows", "automation", "deterministic", "evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "PyYAML>=6,<7",
  "ruamel.yaml>=0.18,<0.19",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "ruff>=0.14,<0.15",
  "twine>=6,<8",
]

[project.urls]
Homepage = "https://github.com/ali-abassi/pi-graph-core"
Repository = "https://github.com/ali-abassi/pi-graph-core"
Issues = "https://github.com/ali-abassi/pi-graph-core/issues"
Documentation = "https://github.com/ali-abassi/pi-graph-core#readme"

[project.scripts]
piw = "pi_graph_core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pi_graph_core = ["schemas/*.json"]

[tool.setuptools.dynamic]
version = {attr = "pi_graph_core.__version__"}

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W605"]
